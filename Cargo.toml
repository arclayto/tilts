[workspace]
resolver = "3"
members = [
    "crates/tilts-core",
    "crates/tilts-data",
    "crates/tilts",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclayto/tilts"
homepage = "https://github.com/arclayto/tilts"
keywords = ["finance", "factor", "fama-french", "portfolio", "regression"]
categories = ["finance", "mathematics", "command-line-utilities"]

[workspace.dependencies]
# internal
tilts-core = { path = "crates/tilts-core", version = "0.0.1" }
tilts-data = { path = "crates/tilts-data", version = "0.0.1" }

# math / data
nalgebra = "0.35"
polars = { version = "0.55", default-features = false, features = ["lazy", "csv", "parquet", "temporal"] }

# plumbing
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
directories = "6"
comfy-table = "8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic lints we consciously don't want
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
